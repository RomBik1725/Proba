<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" font-family="Arial,sans-serif">
<rect width="720" height="400" fill="#f8f9fa"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#333">Лаб.9 — Dictionary&lt;string,Car&gt; + LINQ</text>
<rect x="23" y="58" width="270" height="195" rx="3" fill="#ddd"/>
<rect x="20" y="55" width="270" height="195" rx="3" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="20" y="55" width="270" height="28" rx="3" fill="#4A90D9" stroke="#333" stroke-width="1.5"/>
<text x="155" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Car</text>
<line x1="20" y1="83" x2="290" y2="83" stroke="#333" stroke-width="1"/>
<text x="28" y="98" font-size="11" fill="#222">+ Brand, Model : string</text>
<text x="28" y="115" font-size="11" fill="#222">+ Year : int</text>
<text x="28" y="132" font-size="11" fill="#222">+ Color : string</text>
<text x="28" y="149" font-size="11" fill="#222">+ Mileage : double</text>
<line x1="20" y1="163" x2="290" y2="163" stroke="#333" stroke-width="1"/>
<text x="28" y="178" font-size="11" fill="#222">+ Car(brand,model,year,color,mileage)</text>
<text x="28" y="195" font-size="11" fill="#222">+ GetKey() : string</text>
<text x="28" y="212" font-size="11" fill="#222">    → $"{Brand}_{Model}_{Year}"</text>
<text x="28" y="229" font-size="11" fill="#222">+ ToString() : string</text>
<rect x="320" y="55" width="370" height="175" rx="5" fill="white" stroke="#bbb"/>
<rect x="320" y="55" width="370" height="26" rx="5" fill="#4A90D9" stroke="#bbb"/>
<text x="330" y="72" font-size="12" font-weight="bold" fill="white">Dictionary&lt;string, Car&gt; cars</text>
<rect x="325" y="88" width="360" height="24" fill="#e3f2fd"/>
<text x="332" y="104" font-size="10" fill="#1565c0">"Toyota_Camry_2018"</text><text x="495" y="104" font-size="11" font-weight="bold" fill="#333">→</text><text x="510" y="104" font-size="9" fill="#555">Car(Toyota,Camry,2018,...)</text>
<rect x="325" y="114" width="360" height="24" fill="white"/>
<text x="332" y="130" font-size="10" fill="#1565c0">"BMW_X5_2020"</text><text x="495" y="130" font-size="11" font-weight="bold" fill="#333">→</text><text x="510" y="130" font-size="9" fill="#555">Car(BMW,X5,2020,...)</text>
<rect x="325" y="140" width="360" height="24" fill="#e3f2fd"/>
<text x="332" y="156" font-size="10" fill="#1565c0">"Honda_Civic_2017"</text><text x="495" y="156" font-size="11" font-weight="bold" fill="#333">→</text><text x="510" y="156" font-size="9" fill="#555">Car(Honda,Civic,2017,...)</text>
<rect x="325" y="166" width="360" height="24" fill="white"/>
<text x="332" y="182" font-size="10" fill="#1565c0">"Lada_Vesta_2021"</text><text x="495" y="182" font-size="11" font-weight="bold" fill="#333">→</text><text x="510" y="182" font-size="9" fill="#555">Car(Lada,Vesta,2021,...)</text>
<rect x="20" y="270" width="680" height="120" rx="5" fill="white" stroke="#bbb"/>
<rect x="20" y="270" width="680" height="26" rx="5" fill="#2E8B57" stroke="#bbb"/>
<text x="30" y="286" font-size="12" font-weight="bold" fill="white">LINQ-операции</text>
<rect x="25" y="305" width="320" height="24" rx="2" fill="#e8f5e9"/>
<text x="32" y="320" font-size="10" fill="#1b5e20">OrderBy(c=&gt;c.Year)</text><text x="220" y="320" font-size="9" fill="#555">Сортировка по году</text>
<rect x="355" y="305" width="340" height="24" rx="2" fill="#e8f5e9"/>
<text x="362" y="320" font-size="10" fill="#1b5e20">Where(Contains(q))</text><text x="540" y="320" font-size="9" fill="#555">Поиск по марке/модели</text>
<rect x="25" y="333" width="320" height="24" rx="2" fill="#e8f5e9"/>
<text x="32" y="348" font-size="10" fill="#1b5e20">Average(c=&gt;c.Mileage)</text><text x="220" y="348" font-size="9" fill="#555">Средний пробег</text>
<rect x="355" y="333" width="340" height="24" rx="2" fill="#e8f5e9"/>
<text x="362" y="348" font-size="10" fill="#1b5e20">MaxBy(c=&gt;c.Year)</text><text x="540" y="348" font-size="9" fill="#555">Новейшая модель</text>
<rect x="25" y="361" width="320" height="24" rx="2" fill="#e8f5e9"/>
<text x="32" y="376" font-size="10" fill="#1b5e20">Select(c=&gt;c.Brand).Distinct()</text><text x="240" y="376" font-size="9" fill="#555">Уникальные марки</text>
</svg>