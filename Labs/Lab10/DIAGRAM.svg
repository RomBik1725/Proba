<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" font-family="Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333"/></marker>
  </defs>
<rect width="720" height="400" fill="#f8f9fa"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#333">Лаб.10 — Бинарные файлы. BinaryWriter/Reader.</text>
<rect x="23" y="58" width="260" height="140" rx="3" fill="#ddd"/>
<rect x="20" y="55" width="260" height="140" rx="3" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="20" y="55" width="260" height="36" rx="3" fill="#2E8B57" stroke="#333" stroke-width="1.5"/>
<text x="150" y="68" text-anchor="middle" font-size="9" fill="#ddd" font-style="italic">&lt;&lt;Form&gt;&gt;</text>
<text x="150" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="white">MainForm</text>
<line x1="20" y1="91" x2="280" y2="91" stroke="#333" stroke-width="1"/>
<text x="28" y="106" font-size="11" fill="#555">- dataFile : string = "points3d.dat"</text>
<line x1="20" y1="120" x2="280" y2="120" stroke="#333" stroke-width="1"/>
<text x="28" y="135" font-size="11" fill="#222">+ btnGenerate_Click()</text>
<text x="28" y="152" font-size="11" fill="#222">  — BinaryWriter → points3d.dat</text>
<text x="28" y="169" font-size="11" fill="#222">+ btnCheck_Click()</text>
<text x="28" y="186" font-size="11" fill="#222">  — BinaryReader → поиск в сфере</text>
<rect x="310" y="55" width="390" height="195" rx="5" fill="white" stroke="#bbb"/>
<rect x="310" y="55" width="390" height="26" rx="5" fill="#37474f" stroke="#bbb"/>
<text x="320" y="72" font-size="12" font-weight="bold" fill="white">Формат файла points3d.dat</text>
<rect x="314" y="88" width="382" height="24" fill="#eceff1"/>
<text x="320" y="104" font-size="10" fill="#37474f">байты 0-3</text><text x="430" y="104" font-size="10" font-weight="bold" fill="#1565c0">int32</text><text x="490" y="104" font-size="10" fill="#333">N — количество точек</text>
<rect x="314" y="114" width="382" height="24" fill="white"/>
<text x="320" y="130" font-size="10" fill="#37474f">байты 4-11</text><text x="430" y="130" font-size="10" font-weight="bold" fill="#1565c0">double</text><text x="490" y="130" font-size="10" fill="#333">x₁ — координата X</text>
<rect x="314" y="140" width="382" height="24" fill="#eceff1"/>
<text x="320" y="156" font-size="10" fill="#37474f">байты 12-19</text><text x="430" y="156" font-size="10" font-weight="bold" fill="#1565c0">double</text><text x="490" y="156" font-size="10" fill="#333">y₁ — координата Y</text>
<rect x="314" y="166" width="382" height="24" fill="white"/>
<text x="320" y="182" font-size="10" fill="#37474f">байты 20-27</text><text x="430" y="182" font-size="10" font-weight="bold" fill="#1565c0">double</text><text x="490" y="182" font-size="10" fill="#333">z₁ — координата Z</text>
<rect x="314" y="192" width="382" height="24" fill="#eceff1"/>
<text x="320" y="208" font-size="10" fill="#37474f">Итого:</text><text x="490" y="208" font-size="10" fill="#333">4 + N × 24 байт</text>
<rect x="310" y="270" width="390" height="120" rx="5" fill="white" stroke="#bbb"/>
<rect x="310" y="270" width="390" height="26" rx="5" fill="#880e4f" stroke="#bbb"/>
<text x="320" y="286" font-size="12" font-weight="bold" fill="white">Алгоритм поиска точки в сфере</text>
<text x="320" y="313" font-size="11" fill="#333">for each (x,y,z) in file:</text>
<text x="320" y="333" font-size="11" fill="#333">  dist = √((x-cx)² + (y-cy)² + (z-cz)²)</text>
<text x="320" y="353" font-size="11" fill="#880e4f">  if dist ≤ R → inside++ → вывести</text>
<rect x="20" y="210" width="260" height="130" rx="5" fill="white" stroke="#bbb"/>
<rect x="20" y="210" width="260" height="26" rx="5" fill="#1b5e20" stroke="#bbb"/>
<text x="30" y="226" font-size="12" font-weight="bold" fill="white">BinaryWriter — запись</text>
<text x="30" y="252" font-size="10" fill="#1b5e20">bw.Write(N)  // int</text>
<text x="30" y="270" font-size="10" fill="#1b5e20">for i in 0..N-1:</text>
<text x="30" y="288" font-size="10" fill="#1b5e20">  bw.Write(x)  // double</text>
<text x="30" y="306" font-size="10" fill="#1b5e20">  bw.Write(y)  // double</text>
<text x="30" y="324" font-size="10" fill="#1b5e20">  bw.Write(z)  // double</text>
</svg>