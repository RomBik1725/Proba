<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" font-family="Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333"/></marker>
  </defs>
<rect width="720" height="400" fill="#f8f9fa"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#333">Лаб.8 — Делегаты. События. Лямбда-выражения.</text>
<rect x="23" y="58" width="290" height="235" rx="3" fill="#ddd"/>
<rect x="20" y="55" width="290" height="235" rx="3" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="20" y="55" width="290" height="28" rx="3" fill="#4A90D9" stroke="#333" stroke-width="1.5"/>
<text x="165" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Teacher</text>
<line x1="20" y1="83" x2="310" y2="83" stroke="#333" stroke-width="1"/>
<text x="28" y="98" font-size="11" fill="#222">+ FirstName, LastName : string</text>
<text x="28" y="115" font-size="11" fill="#222">+ Gender : string ("М"/"Ж")</text>
<text x="28" y="132" font-size="11" fill="#222">+ BirthYear, Experience : int</text>
<text x="28" y="149" font-size="11" fill="#222">+ Position : string</text>
<line x1="20" y1="163" x2="310" y2="163" stroke="#333" stroke-width="1"/>
<text x="28" y="178" font-size="11" fill="#222">+ Age : int {get =&gt; Now.Year-BirthYear}</text>
<text x="28" y="195" font-size="11" fill="#222">+ IsPensioner() : bool М≥65/Ж≥60</text>
<text x="28" y="212" font-size="11" fill="#222">+ event OnPensionerDetected</text>
<text x="28" y="229" font-size="11" fill="#222">+ CheckPensioner() : void</text>
<text x="28" y="246" font-size="11" fill="#222">+ static GetExperienceFilter(int)</text>
<text x="28" y="263" font-size="11" fill="#222">    : Func&lt;Teacher,bool&gt;</text>
<rect x="340" y="55" width="200" height="50" rx="4" fill="#fce4ec" stroke="#e91e63" stroke-width="1.5"/>
<rect x="340" y="55" width="200" height="20" rx="4" fill="#e91e63"/>
<text x="348" y="68" font-size="9" fill="white">&lt;&lt;delegate&gt;&gt;</text>
<text x="348" y="90" font-size="11" fill="#880e4f">TeacherDelegate(Teacher t)</text>
<rect x="340" y="125" width="350" height="26" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
<text x="350" y="142" font-size="10.5" fill="#1565c0">Кнопка «Проверить пенсионеров»</text>
<line x1="515" y1="151" x2="515" y2="163" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>
<rect x="340" y="165" width="350" height="26" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
<text x="350" y="182" font-size="10.5" fill="#1565c0">foreach (Teacher t in teachers)</text>
<line x1="515" y1="191" x2="515" y2="203" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>
<rect x="340" y="205" width="350" height="26" rx="3" fill="#fce4ec" stroke="#880e4f"/>
<text x="350" y="222" font-size="10.5" fill="#880e4f">  t.OnPensionerDetected += handler</text>
<line x1="515" y1="231" x2="515" y2="243" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>
<rect x="340" y="245" width="350" height="26" rx="3" fill="#fff3e0" stroke="#e65100"/>
<text x="350" y="262" font-size="10.5" fill="#e65100">  t.CheckPensioner()</text>
<line x1="515" y1="271" x2="515" y2="283" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>
<rect x="340" y="285" width="350" height="26" rx="3" fill="#ffebee" stroke="#b71c1c"/>
<text x="350" y="302" font-size="10.5" fill="#b71c1c">    IsPensioner()? ДА → событие!</text>
<line x1="515" y1="311" x2="515" y2="323" stroke="#666" stroke-width="1" marker-end="url(#arr)"/>
<rect x="340" y="325" width="350" height="26" rx="3" fill="#ffebee" stroke="#b71c1c"/>
<text x="350" y="342" font-size="10.5" fill="#b71c1c">      MessageBox: «Пенсионер: ...»</text>
<rect x="20" y="295" width="300" height="90" rx="4" fill="#fffde7" stroke="#f9a825" stroke-width="1" stroke-dasharray="4,2"/>
<text x="28" y="315" font-size="10" fill="#555">GetExperienceFilter(minExp):</text>
<text x="28" y="331" font-size="10" fill="#555">  return t =&gt; t.Experience &gt;= minExp</text>
<text x="28" y="353" font-size="10" fill="#555">Сортировка лямбдой:</text>
<text x="28" y="369" font-size="10" fill="#555">  teachers.Sort((a,b) =&gt; string.Compare(a.LastName,b.LastName))</text>
</svg>