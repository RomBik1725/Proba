<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" font-family="Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333"/></marker>
  </defs>
<rect width="760" height="420" fill="#f8f9fa"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#333">Лаб.7 — Графика GDI+. Кривые. Меню.</text>
<rect x="23" y="58" width="250" height="126" rx="3" fill="#ddd"/>
<rect x="20" y="55" width="250" height="126" rx="3" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="20" y="55" width="250" height="28" rx="3" fill="#4A90D9" stroke="#333" stroke-width="1.5"/>
<text x="145" y="74" text-anchor="middle" font-size="13" font-weight="bold" fill="white">GraphSettings</text>
<line x1="20" y1="83" x2="270" y2="83" stroke="#333" stroke-width="1"/>
<text x="28" y="98" font-size="11" fill="#222">+ CurveType : int (0-4)</text>
<text x="28" y="115" font-size="11" fill="#222">+ LineColor : Color</text>
<text x="28" y="132" font-size="11" fill="#222">+ LineWidth : float</text>
<text x="28" y="149" font-size="11" fill="#222">+ XMin, XMax, YMin, YMax : double</text>
<rect x="303" y="58" width="250" height="140" rx="3" fill="#ddd"/>
<rect x="300" y="55" width="250" height="140" rx="3" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="300" y="55" width="250" height="36" rx="3" fill="#2E8B57" stroke="#333" stroke-width="1.5"/>
<text x="425" y="68" text-anchor="middle" font-size="9" fill="#ddd" font-style="italic">&lt;&lt;Form&gt;&gt;</text>
<text x="425" y="82" text-anchor="middle" font-size="13" font-weight="bold" fill="white">SettingsDialog</text>
<line x1="300" y1="91" x2="550" y2="91" stroke="#333" stroke-width="1"/>
<text x="308" y="106" font-size="11" fill="#555">- lbColors, lbCurves : ListBox</text>
<text x="308" y="123" font-size="11" fill="#555">- nudCount : NumericUpDown</text>
<text x="308" y="140" font-size="11" fill="#222">+ Result : List&lt;GraphSettings&gt;</text>
<line x1="300" y1="154" x2="550" y2="154" stroke="#333" stroke-width="1"/>
<text x="308" y="170" font-size="11" fill="#222">+ BtnOk_Click() → заполнить Result</text>
<rect x="580" y="55" width="165" height="180" rx="3" fill="#ddd"/>
<rect x="577" y="52" width="165" height="180" rx="3" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="577" y="52" width="165" height="36" rx="3" fill="#2E8B57" stroke="#333" stroke-width="1.5"/>
<text x="659" y="65" text-anchor="middle" font-size="9" fill="#ddd" font-style="italic">&lt;&lt;Form&gt;&gt;</text>
<text x="659" y="79" text-anchor="middle" font-size="13" font-weight="bold" fill="white">MainForm</text>
<line x1="577" y1="88" x2="742" y2="88" stroke="#333" stroke-width="1"/>
<text x="585" y="103" font-size="10" fill="#555">- graphSettings : List&lt;GraphSettings&gt;</text>
<line x1="577" y1="117" x2="742" y2="117" stroke="#333" stroke-width="1"/>
<text x="585" y="132" font-size="10" fill="#222">+ miSelectLines_Click()</text>
<text x="585" y="149" font-size="10" fill="#222">  → new SettingsDialog()</text>
<text x="585" y="166" font-size="10" fill="#222">+ pnlDraw_Paint(Graphics g)</text>
<text x="585" y="183" font-size="10" fill="#222">  → DrawCurve() для каждой</text>
<text x="585" y="200" font-size="10" fill="#222">+ DrawCurve(g, pen, settings)</text>
<text x="585" y="217" font-size="10" fill="#222">  — 1200 точек, WS-преобр.</text>
<rect x="20" y="200" width="530" height="170" rx="5" fill="white" stroke="#bbb"/>
<rect x="20" y="200" width="530" height="24" rx="5" fill="#2E8B57" stroke="#bbb"/>
<text x="30" y="216" font-size="12" font-weight="bold" fill="white">Типы кривых (вариант 6)</text>
<rect x="20" y="232" width="530" height="26" fill="#f5f5f5"/>
<text x="30" y="249" font-size="11" font-weight="bold" fill="#1b5e20">0</text><text x="55" y="249" font-size="11" fill="#333">Прямая</text><text x="180" y="249" font-size="11" fill="#1565c0">y = x</text>
<rect x="20" y="258" width="530" height="26" fill="white"/>
<text x="30" y="275" font-size="11" font-weight="bold" fill="#1b5e20">1</text><text x="55" y="275" font-size="11" fill="#333">Парабола</text><text x="180" y="275" font-size="11" fill="#1565c0">y = x²</text>
<rect x="20" y="284" width="530" height="26" fill="#f5f5f5"/>
<text x="30" y="301" font-size="11" font-weight="bold" fill="#1b5e20">2</text><text x="55" y="301" font-size="11" fill="#333">Гипербола</text><text x="180" y="301" font-size="11" fill="#1565c0">y = 1/x</text>
<rect x="20" y="310" width="530" height="26" fill="white"/>
<text x="30" y="327" font-size="11" font-weight="bold" fill="#1b5e20">3</text><text x="55" y="327" font-size="11" fill="#333">Окружность</text><text x="180" y="327" font-size="11" fill="#1565c0">x=r·cos(t), y=r·sin(t)</text>
<rect x="20" y="336" width="530" height="26" fill="#f5f5f5"/>
<text x="30" y="353" font-size="11" font-weight="bold" fill="#1b5e20">4</text><text x="55" y="353" font-size="11" fill="#333">Роза</text><text x="180" y="353" font-size="11" fill="#1565c0">r = a·cos(3t), t ∈ [0..2π]</text>
</svg>