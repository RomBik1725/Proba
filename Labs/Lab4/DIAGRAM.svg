<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" font-family="Arial,sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto"><polygon points="0 0, 12 4, 0 8" fill="#333"/></marker>
    <marker id="inh" markerWidth="14" markerHeight="10" refX="1" refY="5" orient="auto"><polygon points="0 5, 13 0, 13 10" fill="white" stroke="#333" stroke-width="1.5"/></marker>
  </defs>
<rect width="700" height="440" fill="#f8f9fa"/>
<text x="20" y="28" font-size="16" font-weight="bold" fill="#333">Лаб.4 — Наследование. Перегрузка операторов.</text>
<text x="20" y="46" font-size="11" fill="#777">Иерархия классов UML</text>
<rect x="53" y="68" width="280" height="218" rx="3" fill="#ddd"/>
<rect x="50" y="65" width="280" height="218" rx="3" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="50" y="65" width="280" height="28" rx="3" fill="#4A90D9" stroke="#333" stroke-width="1.5"/>
<text x="190" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Point3D</text>
<line x1="50" y1="93" x2="330" y2="93" stroke="#333" stroke-width="1"/>
<text x="58" y="108" font-size="11" fill="#555">- x, y, z : double</text>
<line x1="50" y1="122" x2="330" y2="122" stroke="#333" stroke-width="1"/>
<text x="58" y="137" font-size="11" fill="#222">+ Point3D() / Point3D(x,y,z)</text>
<text x="58" y="154" font-size="11" fill="#222">+ X/Y/Z {validate}</text>
<text x="58" y="171" font-size="11" fill="#222">+ DistanceToOrigin() : double</text>
<text x="58" y="188" font-size="11" fill="#222">+ operator +(a,b) : Point3D</text>
<text x="58" y="205" font-size="11" fill="#222">+ operator -(a,b) : Point3D</text>
<text x="58" y="222" font-size="11" fill="#222">+ operator ==(a,b) : bool</text>
<text x="58" y="239" font-size="11" fill="#222">+ virtual GetInfo() : string</text>
<text x="58" y="256" font-size="11" fill="#222">+ ToString() : string</text>
<rect x="53" y="358" width="280" height="70" rx="3" fill="#ddd"/>
<rect x="50" y="355" width="280" height="70" rx="3" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="50" y="355" width="280" height="28" rx="3" fill="#4A90D9" stroke="#333" stroke-width="1.5"/>
<text x="190" y="374" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ColoredPoint3D</text>
<line x1="50" y1="383" x2="330" y2="383" stroke="#333" stroke-width="1"/>
<text x="58" y="398" font-size="11" fill="#222">+ Color : Color  |  + Size : int</text>
<text x="58" y="415" font-size="11" fill="#222">+ override GetInfo()  |  + operator +(a,b)</text>
<line x1="190" y1="355" x2="190" y2="283" stroke="#333" stroke-width="1.5" marker-start="url(#inh)"/>
<text x="198" y="322" font-size="10" fill="#777">наследование</text>
<rect x="380" y="65" width="290" height="116" rx="3" fill="white" stroke="#333" stroke-width="1.5"/>
<rect x="380" y="65" width="290" height="28" rx="3" fill="#4A90D9" stroke="#333" stroke-width="1.5"/>
<text x="525" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="white">InfoForm</text>
<line x1="380" y1="93" x2="670" y2="93" stroke="#333" stroke-width="1"/>
<text x="388" y="108" font-size="11" fill="#555">- p1, p2 : Point3D</text>
<line x1="380" y1="122" x2="670" y2="122" stroke="#333" stroke-width="1"/>
<text x="388" y="137" font-size="11" fill="#222">+ InfoForm(p1, p2)</text>
<text x="388" y="154" font-size="11" fill="#222">+ ShowDialog() : DialogResult</text>
<text x="388" y="171" font-size="11" fill="#222">  (p1-p2).DistanceToOrigin()</text>
<rect x="380" y="210" width="290" height="112" rx="4" fill="#fffde7" stroke="#f9a825" stroke-width="1" stroke-dasharray="4,2"/>
<text x="388" y="230" font-size="10" fill="#555">Point3D + Point3D:</text>
<text x="388" y="246" font-size="10" fill="#555">  new Point3D(a.X+b.X, a.Y+b.Y, a.Z+b.Z)</text>
<text x="388" y="262" font-size="10" fill="#555">ColoredPoint3D + ColoredPoint3D:</text>
<text x="388" y="278" font-size="10" fill="#555">  new Colored(a.X+b.X,..., a.Color)</text>
<text x="388" y="294" font-size="10" fill="#555">Point3D == Point3D:</text>
<text x="388" y="310" font-size="10" fill="#555">  a.x==b.x &amp;&amp; a.y==b.y &amp;&amp; a.z==b.z</text>
</svg>